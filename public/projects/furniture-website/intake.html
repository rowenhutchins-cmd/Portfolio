<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - Intake Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="CSS/styles.css" />
    <style>
      .back-to-portfolio {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 2147483647;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        color: #5ed29c;
        background-color: rgba(7, 11, 10, 0.85);
        border: 1.5px solid #5ed29c;
        padding: 10px 20px;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        border-radius: 999px;
        backdrop-filter: blur(4px);
        transition: background-color 0.2s ease;
      }
      .back-to-portfolio:hover {
        background-color: rgba(94, 210, 156, 0.12);
      }

      .intake-header {
        background-color: var(--color-olive);
        padding: 44px 20px;
        text-align: center;
      }

      .intake-header h1 {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: clamp(2rem, 4vw, 2.6rem);
        color: #fff;
      }

      main.intake-main {
        max-width: 640px;
        margin: 48px auto;
        background: var(--color-surface);
        padding: 36px 32px 32px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      main.intake-main h2 {
        font-family: var(--font-display);
        font-weight: 600;
        text-align: center;
        margin-bottom: 24px;
        color: var(--color-text);
      }

      .intake-main label {
        display: block;
        margin-top: 16px;
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--color-text);
      }

      .intake-main input {
        width: 100%;
        padding: 12px 14px;
        margin-top: 6px;
        border: 1px solid var(--color-line);
        border-radius: 10px;
        font-family: var(--font-body);
        font-size: 1rem;
        color: var(--color-text);
        background-color: var(--color-bg);
      }

      .intake-main input:focus {
        outline: 2px solid var(--color-olive);
        outline-offset: 1px;
      }

      .intake-main button {
        margin-top: 24px;
        width: 100%;
        padding: 14px;
        background-color: var(--color-terracotta);
        color: #fff;
        border: none;
        border-radius: 999px;
        font-family: var(--font-body);
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s ease, transform 0.2s ease;
      }

      .intake-main button:hover {
        background-color: var(--color-terracotta-dark);
        transform: translateY(-2px);
      }

      .back-link {
        display: block;
        margin-top: 20px;
        text-align: center;
        color: var(--color-olive);
        font-weight: 600;
        text-decoration: none;
      }

      .back-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <a
      href="/"
      class="back-to-portfolio"
      onclick="event.preventDefault(); window.close(); setTimeout(function () { window.location.href = '/'; }, 400);"
      >&larr; Back to Portfolio</a
    >
    <header class="intake-header">
      <h1>Contact Us</h1>
    </header>
    <main class="intake-main">
      <h2>Intake Form</h2>
      <form action="#" method="post">
        <label for="firstName">First Name</label>
        <input
          type="text"
          id="firstName"
          name="firstName"
          placeholder="John"
          required
        />

        <label for="lastName">Last Name</label>
        <input
          type="text"
          id="lastName"
          name="lastName"
          placeholder="Doe"
          required
        />

        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="doe@example.com"
          required
        />

        <label for="phone">Phone Number</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="(555) 123-4567"
          required
        />

        <label for="city">City</label>
        <input
          type="text"
          id="city"
          name="city"
          placeholder="Atlanta"
          required
        />

        <label for="state">State</label>
        <input
          type="text"
          id="state"
          name="state"
          placeholder="GA"
          maxlength="2"
          required
        />

        <button type="submit">Submit</button>
      </form>

      <a href="index.html" class="back-link">&larr; Back to Home</a>
    </main>

    <footer class="footer">
      <p>&copy; <span id="year"></span> Your Site Name. All rights reserved.</p>
    </footer>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
