<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - Intake Form</title>
    <style>
      body {
        background-color: #f5f5f5;
        font-family: Arial, sans-serif;
        margin: 0;
      }

      header {
        background-color: lightblue;
        padding: 30px;
        text-align: center;
      }

      header h1 {
        margin: 0;
        font-size: 36px;
        color: #fff;
        text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
      }

      main {
        max-width: 800px;
        margin: 40px auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
      }

      h2 {
        text-align: center;
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
      }

      input {
        width: 100%;
        padding: 12px;
        margin-top: 6px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
      }

      button {
        margin-top: 20px;
        width: 100%;
        padding: 14px;
        background-color: lightblue;
        color: white;
        border: none;
        border-radius: 20px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }

      button:hover {
        transform: translateY(-3px);
        box-shadow: 0px 6px 10px rgba(0, 0, 0, 0.3);
      }

      .back-link {
        display: block;
        margin-top: 20px;
        text-align: center;
        color: lightblue;
        font-weight: bold;
        text-decoration: none;
      }

      footer {
        background-color: lightgray;
        text-align: center;
        padding: 15px;
        margin-top: 40px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Contact Us</h1>
    </header>
    <main>
      <h2>Intake Form</h2>
      <form action="#" method="post">
        <label for="firstName">First Name</label>
        <input
          type="text"
          id="firstName"
          name="firstName"
          placeholder="John"
          required
        />

        <label for="lastName">Last Name</label>
        <input
          type="text"
          id="lastName"
          name="lastName"
          placeholder="Doe"
          required
        />

        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="doe@example.com"
          required
        />

        <label for="phone">Phone Number</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="(555) 123-4567"
          required
        />

        <label for="city">City</label>
        <input
          type="text"
          id="city"
          name="city"
          placeholder="Atlanta"
          required
        />

        <label for="state">State</label>
        <input
          type="text"
          id="state"
          name="state"
          placeholder="GA"
          maxlength="2"
          required
        />

        <button type="submit">Submit</button>
      </form>

      <a href="index.html" class="back-link">&larr; Back to Home</a>
    </main>

    <footer>
      <p>&copy; 2026 Your Site Name. All rights reserved.</p>
    </footer>
  </body>
</html>
