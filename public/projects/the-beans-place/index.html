<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/projects/the-beans-place/Beans_logo.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="The Beans Place — Premium coffee beans sourced from around the world. Order online for fresh roasts delivered to your door." />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,700&display=swap"
            rel="stylesheet" />
        <title>The Beans Place — Premium Coffee</title>
      <script type="module" crossorigin src="/projects/the-beans-place/assets/index-DH4FCtXR.js"></script>
      <link rel="stylesheet" crossorigin href="/projects/the-beans-place/assets/index-C6hykXZN.css">
    </head>
    <body>
        <div id="root"></div>
        <a
          id="portfolioBackButton"
          href="/"
          style="position:fixed;top:20px;left:110px;z-index:2147483647;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#5ed29c;background-color:rgba(7,11,10,0.85);border:1.5px solid #5ed29c;padding:10px 20px;font-family:system-ui,sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;border-radius:999px;backdrop-filter:blur(4px);transition:background-color 0.2s ease;"
          onmouseover="this.style.backgroundColor='rgba(94,210,156,0.12)'"
          onmouseout="this.style.backgroundColor='rgba(7,11,10,0.85)'"
          onclick="event.preventDefault(); window.close(); setTimeout(function () { window.location.href = '/'; }, 400);"
        >&larr; Back to Portfolio</a>
        <script>
          (function () {
            function removeDuplicateBackButtons() {
              document.querySelectorAll("a").forEach(function (el) {
                if (
                  el.id !== "portfolioBackButton" &&
                  el.textContent.indexOf("Back to Portfolio") !== -1
                ) {
                  el.remove();
                }
              });
            }
            removeDuplicateBackButtons();
            var observer = new MutationObserver(removeDuplicateBackButtons);
            observer.observe(document.body, { childList: true, subtree: true });
            window.addEventListener("load", function () {
              setTimeout(function () {
                observer.disconnect();
              }, 3000);
            });
          })();
        </script>
    </body>
</html>
