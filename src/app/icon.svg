<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64">

  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#0F172A"/>


  <!-- R -->
  <g fill="#3B82F6">

    <!-- R top -->
    <rect x="18" y="10"
          width="18"
          height="6"/>

    <!-- R bowl -->
    <rect x="36" y="16"
          width="6"
          height="12"/>

    <!-- R diagonal -->
    <polygon points="
      29,31
      35,31
      42,54
      36,54
    "/>

  </g>


  <!-- H -->
  <rect x="43" y="10"
        width="6"
        height="44"
        fill="#06B6D4"/>


  <!-- Shared left stem -->
  <g>

    <!-- R side -->
    <rect x="12" y="10"
          width="3"
          height="44"
          fill="#3B82F6"/>

    <!-- Thin blend -->
    <rect x="15" y="10"
          width="1"
          height="44"
          fill="#1C9FD0"/>

    <!-- H side -->
    <rect x="16" y="10"
          width="2"
          height="44"
          fill="#06B6D4"/>

  </g>


  <!-- Shared crossbar -->
  <g>

    <!-- H upper -->
    <rect x="18" y="28"
          width="25"
          height="3"
          fill="#06B6D4"/>

    <!-- Thin blend -->
    <rect x="18" y="31"
          width="25"
          height="1"
          fill="#1C9FD0"/>

    <!-- R lower -->
    <rect x="18" y="32"
          width="25"
          height="3"
          fill="#3B82F6"/>

  </g>

</svg>
